name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.1

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.13.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm --filter . --filter "./packages/*" install --frozen-lockfile

      - name: Run package checks
        run: pnpm run version:check && pnpm run build && pnpm run test

      - name: Pack npm release packages
        env:
          NPM_PACKAGES_OUTPUT: ${{ runner.temp }}/npm-packages
        run: node scripts/npm-release.mjs pack --output-dir "$NPM_PACKAGES_OUTPUT"

      - name: Build recording skill runtime
        env:
          RUNTIME_OUTPUT: ${{ runner.temp }}/recording-skill-runtime
        run: node scripts/build-recording-skill-runtime.mjs --output-dir "$RUNTIME_OUTPUT"

      - name: Verify recording skill runtime
        env:
          RUNTIME_OUTPUT: ${{ runner.temp }}/recording-skill-runtime
        run: node scripts/verify-recording-skill-runtime.mjs --output-dir "$RUNTIME_OUTPUT"

      - name: Run Stage 6 evaluation with timing
        run: pnpm run evaluate:stage6:run
