name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.1

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.13.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm --filter . --filter "./packages/*" --filter "./packages/extensions/*" --filter @divebell/mf-playground-remote... --filter "./tests/e2e/extension-mf/fixtures/*" install --frozen-lockfile

      - name: Run package checks
        run: pnpm run lint && pnpm run version:check && pnpm run build && pnpm run test:release-script && pnpm run test

      - name: Run Divebell end-to-end acceptance
        run: pnpm run test:e2e:run

      - name: Pack npm release packages
        env:
          NPM_PACKAGES_OUTPUT: ${{ runner.temp }}/npm-packages
        run: node scripts/npm-release.mjs pack --output-dir "$NPM_PACKAGES_OUTPUT"

      - name: Build recording skill runtime
        env:
          RUNTIME_OUTPUT: ${{ runner.temp }}/recording-skill-runtime
        run: node scripts/build-recording-skill-runtime.mjs --output-dir "$RUNTIME_OUTPUT"

      - name: Verify recording skill runtime
        env:
          RUNTIME_OUTPUT: ${{ runner.temp }}/recording-skill-runtime
        run: node scripts/verify-recording-skill-runtime.mjs --output-dir "$RUNTIME_OUTPUT"

      - name: Run Stage 6 evaluation with timing
        run: pnpm run evaluate:stage6:run

  node20-runtime:
    name: Node 20 Runtime Package
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.1

      - name: Setup Node.js for package assembly
        uses: actions/setup-node@v6
        with:
          node-version: 24.13.0
          cache: pnpm

      - name: Install runtime package dependencies
        run: pnpm --filter @divebell/cli... install --frozen-lockfile

      - name: Build and pack local runtime packages
        env:
          RUNTIME_PACKAGE_OUTPUT: ${{ runner.temp }}/divebell-runtime-packages
        run: |
          set -euo pipefail
          pnpm --filter @divebell/cli... build
          mkdir -p "$RUNTIME_PACKAGE_OUTPUT"
          pnpm --filter @divebell/cli... pack --pack-destination "$RUNTIME_PACKAGE_OUTPUT"
          npm pack packages/cli/node_modules/@divebell/agent-browser \
            --pack-destination "$RUNTIME_PACKAGE_OUTPUT" \
            --ignore-scripts

      - name: Setup Node.js 20
        uses: actions/setup-node@v6
        with:
          node-version: 20.20.2

      - name: Install local runtime packages and run setup
        shell: bash
        env:
          RUNTIME_PACKAGE_OUTPUT: ${{ runner.temp }}/divebell-runtime-packages
          DIVEBELL_RUNTIME_ROOT: ${{ runner.temp }}/divebell-node20-runtime
        run: |
          set -euo pipefail

          echo "== Environment =="
          echo "node: $(node --version)"
          echo "npm: $(npm --version)"
          echo "pwd: $(pwd)"

          mapfile -t package_archives < <(find "$RUNTIME_PACKAGE_OUTPUT" -maxdepth 1 -name '*.tgz' -print | sort)
          test "${#package_archives[@]}" -gt 0
          printf "package archive: %s\n" "${package_archives[@]}"

          mkdir -p "$DIVEBELL_RUNTIME_ROOT"/{h,s,p,work}
          cd "$DIVEBELL_RUNTIME_ROOT/work"
          : > .npmrc

          echo "== offline npm install =="
          npm_output=$(npm --cache "$DIVEBELL_RUNTIME_ROOT/npm-cache" \
            --offline \
            --no-audit \
            --no-fund \
            install \
            --global \
            --prefix "$DIVEBELL_RUNTIME_ROOT/p" \
            "${package_archives[@]}" 2>&1) || {
            npm_exit=$?
            printf "%s\n" "$npm_output"
            echo "npm install failed with exit code $npm_exit"
            exit $npm_exit
          }
          printf "%s\n" "$npm_output"
          echo "npm install completed successfully."

          echo "== divebell setup =="
          export HOME="$DIVEBELL_RUNTIME_ROOT/h"
          export DIVEBELL_HOME="$DIVEBELL_RUNTIME_ROOT/h/.divebell"
          export AGENT_BROWSER_SOCKET_DIR="$DIVEBELL_RUNTIME_ROOT/s"
          setup_output=$("$DIVEBELL_RUNTIME_ROOT/p/bin/divebell" setup 2>&1) || {
            setup_exit=$?
            printf "%s\n" "$setup_output"
            echo "divebell setup failed with exit code $setup_exit"
            exit $setup_exit
          }
          printf "%s\n" "$setup_output"
          echo "divebell setup completed successfully."
