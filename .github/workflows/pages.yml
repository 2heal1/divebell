name: Deploy Quick Start to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/pages.yml"
      - "demos/quickstart/**"
      - "packages/chunk-map/**"
      - "packages/core/**"
      - "packages/rspack-plugin/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.1
      - uses: actions/setup-node@v6
        with:
          node-version: 24.13.0
          cache: pnpm
      - run: pnpm --filter @divebell/demo-quickstart... install --frozen-lockfile
      - run: pnpm --filter @divebell/demo-quickstart build:pages
      - run: DIVEBELL_PAGES_BASE=/divebell/quickstart/ pnpm --filter @divebell/demo-quickstart verify:build
      - uses: actions/configure-pages@v5
      - run: |
          mkdir -p .pages/quickstart
          cp -R demos/quickstart/dist/. .pages/quickstart/
          cp demos/quickstart/pages-root.html .pages/index.html
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .pages

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
