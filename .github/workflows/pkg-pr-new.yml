name: pkg.pr.new Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  issues: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  publish-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.1

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.13.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm --filter . --filter "./packages/*" --filter "./packages/extensions/*" --filter @divebell/mf-playground-remote... --filter "./tests/e2e/extension-mf/fixtures/*" install --frozen-lockfile

      - name: Run checks
        run: pnpm check

      - name: Publish preview packages
        run: >
          pnpm exec pkg-pr-new publish
          --pnpm
          --packageManager=pnpm
          --comment=update
          --commentWithSha
          packages/core
          packages/bridge
          packages/chunk-map
          packages/rspack-plugin
          packages/cli
          packages/modern-plugin
          packages/extensions/code-usage
          packages/extensions/imitate
          packages/extensions/memory
          packages/extensions/mf
