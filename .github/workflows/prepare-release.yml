name: Prepare OpenRuntime Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version increment for all OpenRuntime packages and the recording runtime
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: prepare-openruntime-release
  cancel-in-progress: false

jobs:
  prepare-release-pr:
    if: github.repository == '2heal1/openruntime' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.13.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Confirm current release baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current_tag=$(node -p "require('./skills/record-openruntime-workflow/references/openruntime-cli-runtime.json').tag")
          gh release view "$current_tag" >/dev/null
          node scripts/npm-release.mjs check

      - name: Bump release version
        run: node scripts/bump-recording-skill-runtime.mjs "${{ inputs.bump }}"

      - name: Read release metadata
        id: metadata
        run: |
          version=$(node -p "require('./skills/record-openruntime-workflow/references/openruntime-cli-runtime.json').version")
          tag=$(node -p "require('./skills/record-openruntime-workflow/references/openruntime-cli-runtime.json').tag")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Create release branch and pull request
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.metadata.outputs.version }}
          TAG: ${{ steps.metadata.outputs.tag }}
        run: |
          branch="release/openruntime-v${VERSION}"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            existing=$(gh pr list --head "$branch" --state open --json url --jq '.[0].url')
            echo "Release branch already exists: $branch"
            if [ -n "$existing" ]; then echo "Pull request: $existing"; fi
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add \
            packages/core/package.json \
            packages/bridge/package.json \
            packages/chunk-map/package.json \
            packages/rspack-plugin/package.json \
            packages/modern-plugin/package.json \
            packages/cli/package.json \
            packages/extension-code-usage/package.json \
            packages/extension-troubleshooting/package.json \
            packages/extension-imitate/package.json \
            packages/extension-memory/package.json \
            skills/record-openruntime-workflow/references/openruntime-cli-runtime.json
          git commit -m "chore: prepare OpenRuntime ${VERSION}" -m "Co-Authored-By: Riff"
          git push origin "$branch"
          gh pr create \
            --base main \
            --head "$branch" \
            --title "chore: release OpenRuntime ${VERSION}" \
            --body "Bumps every OpenRuntime npm package and the recording skill runtime to ${VERSION}. After this PR passes CI and is merged, the trusted workflow publishes npm packages through OIDC, then creates ${TAG} with the recording runtime assets.

          Co-Authored-By: Riff"
          gh workflow run ci.yml --ref "$branch"
