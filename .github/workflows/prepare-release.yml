name: Prepare Divebell Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version increment for all Divebell packages and the recording runtime
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: prepare-divebell-release
  cancel-in-progress: false

jobs:
  prepare-release-pr:
    if: github.repository == '2heal1/divebell' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.13.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Confirm current release baseline
        id: baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current_tag=$(node -p "require('./skills/record-divebell-workflow/references/divebell-cli-runtime.json').tag")
          current_version=$(node -p "require('./skills/record-divebell-workflow/references/divebell-cli-runtime.json').version")
          recovery_url="https://github.com/${GITHUB_REPOSITORY}/actions/workflows/release.yml"
          if ! gh release view "$current_tag" >/dev/null 2>&1; then
            echo "::error::Release $current_tag is incomplete. Run Publish Divebell Release from main with version $current_version before preparing the next release. $recovery_url"
            exit 1
          fi
          if ! node scripts/npm-release.mjs check; then
            echo "::error::Release $current_tag is incomplete on npm. Run Publish Divebell Release from main with version $current_version before preparing the next release. $recovery_url"
            exit 1
          fi
          echo "tag=$current_tag" >> "$GITHUB_OUTPUT"

      - name: Bump release version
        run: |
          node scripts/bump-recording-skill-runtime.mjs "${{ inputs.bump }}"
          node scripts/check-package-versions.mjs

      - name: Read release metadata
        id: metadata
        run: |
          version=$(node -p "require('./skills/record-divebell-workflow/references/divebell-cli-runtime.json').version")
          tag=$(node -p "require('./skills/record-divebell-workflow/references/divebell-cli-runtime.json').tag")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Generate release pull request description
        env:
          BASE_TAG: ${{ steps.baseline.outputs.tag }}
          VERSION: ${{ steps.metadata.outputs.version }}
          TAG: ${{ steps.metadata.outputs.tag }}
          PR_BODY: ${{ runner.temp }}/divebell-release-pr.md
          CHANGESET_FILES: ${{ runner.temp }}/divebell-release-changesets.txt
        run: |
          node scripts/generate-release-pr-body.mjs \
            --base "$BASE_TAG" \
            --version "$VERSION" \
            --tag "$TAG" \
            --output "$PR_BODY" \
            --changeset-output "$CHANGESET_FILES"

      - name: Create release branch and pull request
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.metadata.outputs.version }}
          PR_BODY: ${{ runner.temp }}/divebell-release-pr.md
          CHANGESET_FILES: ${{ runner.temp }}/divebell-release-changesets.txt
        run: |
          branch="release/divebell-v${VERSION}"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            existing=$(gh pr list --head "$branch" --state open --json url --jq '.[0].url')
            echo "Release branch already exists: $branch"
            if [ -n "$existing" ]; then echo "Pull request: $existing"; fi
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          mapfile -t changeset_files < "$CHANGESET_FILES"
          if [ "${#changeset_files[@]}" -eq 0 ]; then
            echo "No changeset files were selected for this release." >&2
            exit 1
          fi
          git rm -- "${changeset_files[@]}"
          git add \
            packages/*/package.json \
            packages/extensions/*/package.json \
            skills/record-divebell-workflow/references/divebell-cli-runtime.json
          git commit -m "chore: prepare Divebell ${VERSION}"
          git push origin "$branch"
          gh pr create \
            --base main \
            --head "$branch" \
            --title "chore: release Divebell ${VERSION}" \
            --body-file "$PR_BODY"
          gh workflow run ci.yml --ref "$branch"
