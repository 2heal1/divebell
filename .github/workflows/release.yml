name: Publish Divebell Release

on:
  pull_request:
    branches:
      - main
    types:
      - closed

permissions:
  contents: write
  id-token: write
  pull-requests: read

concurrency:
  group: divebell-release-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.repository == '2heal1/divebell' &&
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'release/divebell-v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout merged release
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.1

      - name: Setup Node.js for npm OIDC
        uses: actions/setup-node@v6
        with:
          node-version: 24.13.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm --filter . --filter "./packages/*" install --frozen-lockfile

      - name: Install OIDC-capable npm
        run: npm install --global npm@11.15.0

      - name: Validate merged release pull request
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_BRANCH: ${{ github.event.pull_request.head.ref }}
          RELEASE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          RELEASE_FILES: ${{ runner.temp }}/divebell-release-files.txt
        run: |
          gh pr diff "${{ github.event.pull_request.number }}" --name-only > "$RELEASE_FILES"
          node scripts/validate-divebell-release.mjs \
            --branch "$RELEASE_BRANCH" \
            --base "$RELEASE_BASE_SHA" \
            --changed-files "$RELEASE_FILES"

      - name: Build packages
        run: pnpm run build

      - name: Publish npm packages with OIDC
        env:
          NPM_PACKAGES_OUTPUT: ${{ runner.temp }}/npm-packages
        run: node scripts/npm-release.mjs publish --output-dir "$NPM_PACKAGES_OUTPUT"

      - name: Build recording runtime bundle
        env:
          RUNTIME_OUTPUT: ${{ runner.temp }}/recording-skill-runtime
        run: node scripts/build-recording-skill-runtime.mjs --output-dir "$RUNTIME_OUTPUT"

      - name: Verify recording runtime bundle
        env:
          RUNTIME_OUTPUT: ${{ runner.temp }}/recording-skill-runtime
        run: node scripts/verify-recording-skill-runtime.mjs --output-dir "$RUNTIME_OUTPUT"

      - name: Read release metadata
        id: metadata
        env:
          RUNTIME_OUTPUT: ${{ runner.temp }}/recording-skill-runtime
        run: |
          node - <<'NODE'
          const { appendFileSync } = require('node:fs');
          const { join } = require('node:path');
          const manifest = require('./skills/record-divebell-workflow/references/divebell-cli-runtime.json');
          appendFileSync(process.env.GITHUB_OUTPUT, [
            `version=${manifest.version}`,
            `tag=${manifest.tag}`,
            `asset=${join(process.env.RUNTIME_OUTPUT, manifest.asset.name)}`,
            `asset_name=${manifest.asset.name}`,
            `checksum=${join(process.env.RUNTIME_OUTPUT, manifest.asset.checksumName)}`,
            `checksum_name=${manifest.asset.checksumName}`
          ].join('\n') + '\n');
          NODE

      - name: Create or finish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          TAG: ${{ steps.metadata.outputs.tag }}
          VERSION: ${{ steps.metadata.outputs.version }}
          ASSET: ${{ steps.metadata.outputs.asset }}
          ASSET_NAME: ${{ steps.metadata.outputs.asset_name }}
          CHECKSUM: ${{ steps.metadata.outputs.checksum }}
          CHECKSUM_NAME: ${{ steps.metadata.outputs.checksum_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            is_draft=$(gh release view "$TAG" --json isDraft --jq '.isDraft')
            asset_names=$(gh release view "$TAG" --json assets --jq '.assets[].name')
            if [ "$is_draft" = "false" ]; then
              if echo "$asset_names" | grep -Fxq "$ASSET_NAME" && echo "$asset_names" | grep -Fxq "$CHECKSUM_NAME"; then
                echo "Release $TAG is already published with both assets."
                exit 0
              fi
              echo "Published release $TAG is missing expected assets; refusing to mutate it." >&2
              exit 1
            fi
            gh release upload "$TAG" "$ASSET" "$CHECKSUM" --clobber
          else
            gh release create "$TAG" "$ASSET" "$CHECKSUM" \
              --draft \
              --target "$RELEASE_SHA" \
              --title "Divebell ${VERSION}" \
              --notes "Publishes all @divebell npm packages through OIDC and provides the versioned runtime bundle used by record-divebell-workflow."
          fi
          gh release edit "$TAG" --draft=false --latest=false
