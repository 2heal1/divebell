<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1200"
  height="660"
  viewBox="0 0 1200 660"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">Divebell workflow</title>
  <desc id="description">
    A comparison of Web debugging without Divebell, where a user manually carries context
    between a page and a coding agent, and with Divebell, where the page, browser diagnostics,
    existing tools, and the coding agent are connected.
  </desc>

  <rect width="1200" height="660" rx="28" fill="#F6F7FB" />

  <g
    font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
  >
    <text
      x="600"
      y="34"
      fill="#64748B"
      font-size="11"
      font-weight="700"
      letter-spacing="2.2"
      text-anchor="middle"
    >DIVEBELL WORKFLOW</text>
    <text
      x="600"
      y="63"
      fill="#0F172A"
      font-size="22"
      font-weight="700"
      text-anchor="middle"
    >From context handoffs to a connected Web dev loop</text>

    <!-- Without Divebell -->
    <g>
      <rect x="40" y="88" width="520" height="530" rx="24" fill="#FFFFFF" stroke="#E2E8F0" />
      <rect x="40" y="88" width="5" height="530" rx="2.5" fill="#FDA4AF" />

      <circle cx="76" cy="130" r="12" fill="#FFF1F2" />
      <path d="M70 130h12M76 124v12" stroke="#E11D48" stroke-width="1.8" stroke-linecap="round" transform="rotate(45 76 130)" />
      <text x="98" y="137" fill="#0F172A" font-size="20" font-weight="700">Without Divebell</text>

      <rect x="409" y="114" width="115" height="28" rx="14" fill="#FFF1F2" stroke="#FECDD3" />
      <text x="466.5" y="132.5" fill="#BE123C" font-size="10" font-weight="800" letter-spacing="1.2" text-anchor="middle">CONTEXT GAP</text>

      <line x1="72" y1="156" x2="528" y2="156" stroke="#E2E8F0" />

      <!-- Real Web page -->
      <rect x="72" y="178" width="188" height="102" rx="16" fill="#F8FAFC" stroke="#CBD5E1" />
      <path d="M72 201h188" stroke="#CBD5E1" />
      <circle cx="88" cy="190" r="3" fill="#FDA4AF" />
      <circle cx="99" cy="190" r="3" fill="#FCD34D" />
      <circle cx="110" cy="190" r="3" fill="#86EFAC" />
      <rect x="88" y="216" width="28" height="28" rx="8" fill="#E2E8F0" />
      <path d="M96 226h12M96 232h8" stroke="#64748B" stroke-width="1.7" stroke-linecap="round" />
      <text x="126" y="226" fill="#0F172A" font-size="13" font-weight="700">Real Web page</text>
      <text x="126" y="245" fill="#64748B" font-size="11">User sees the issue</text>
      <rect x="88" y="258" width="80" height="7" rx="3.5" fill="#E2E8F0" />

      <!-- Coding Agent -->
      <rect x="340" y="178" width="188" height="102" rx="16" fill="#F8FAFC" stroke="#CBD5E1" />
      <rect x="356" y="194" width="36" height="36" rx="10" fill="#E2E8F0" />
      <path d="M364 207l5 5-5 5M373 217h10" fill="none" stroke="#475569" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
      <text x="402" y="207" fill="#0F172A" font-size="13" font-weight="700">Coding Agent</text>
      <text x="402" y="226" fill="#64748B" font-size="11">Missing page context</text>
      <rect x="356" y="250" width="124" height="8" rx="4" fill="#E2E8F0" />
      <rect x="356" y="264" width="88" height="6" rx="3" fill="#E2E8F0" />

      <!-- Broken connection -->
      <line x1="260" y1="229" x2="282" y2="229" stroke="#FDA4AF" stroke-width="2" stroke-dasharray="4 4" />
      <line x1="318" y1="229" x2="340" y2="229" stroke="#FDA4AF" stroke-width="2" stroke-dasharray="4 4" />
      <circle cx="300" cy="229" r="14" fill="#FFF1F2" stroke="#FECDD3" />
      <path d="M295 224l10 10M305 224l-10 10" stroke="#E11D48" stroke-width="2" stroke-linecap="round" />

      <!-- Manual handoff -->
      <rect x="72" y="306" width="456" height="276" rx="18" fill="#FFF8F8" stroke="#FECDD3" />
      <circle cx="96" cy="334" r="12" fill="#FFE4E6" />
      <path d="M96 327v8M96 340v1" stroke="#BE123C" stroke-width="2" stroke-linecap="round" />
      <text x="118" y="339" fill="#881337" font-size="14" font-weight="700">Manual context handoff</text>

      <g fill="#FFFFFF" stroke="#FECDD3">
        <rect x="92" y="358" width="416" height="42" rx="12" />
        <rect x="92" y="410" width="416" height="58" rx="12" />
        <rect x="92" y="478" width="416" height="42" rx="12" />
        <rect x="92" y="530" width="416" height="34" rx="12" />
      </g>

      <g>
        <circle cx="114" cy="379" r="10" fill="#FFF1F2" />
        <text x="114" y="383" fill="#BE123C" font-size="10" font-weight="800" text-anchor="middle">1</text>
        <text x="136" y="383" fill="#334155" font-size="12.5" font-weight="600">Capture screenshots and describe the error</text>

        <circle cx="114" cy="439" r="10" fill="#FFF1F2" />
        <text x="114" y="443" fill="#BE123C" font-size="10" font-weight="800" text-anchor="middle">2</text>
        <text x="136" y="433" fill="#334155" font-size="12.5" font-weight="600">Add page, environment, user path,</text>
        <text x="136" y="451" fill="#64748B" font-size="11.5">and resource information</text>

        <circle cx="114" cy="499" r="10" fill="#FFF1F2" />
        <text x="114" y="503" fill="#BE123C" font-size="10" font-weight="800" text-anchor="middle">3</text>
        <text x="136" y="503" fill="#334155" font-size="12.5" font-weight="600">Tell the agent which tool to call</text>

        <circle cx="114" cy="547" r="10" fill="#FFF1F2" />
        <text x="114" y="551" fill="#BE123C" font-size="10" font-weight="800" text-anchor="middle">4</text>
        <text x="136" y="551" fill="#334155" font-size="12.5" font-weight="600">Return to the page and verify manually</text>
      </g>

      <rect x="181" y="590" width="238" height="26" rx="13" fill="#FFF1F2" />
      <text x="300" y="607" fill="#BE123C" font-size="10.5" font-weight="700" text-anchor="middle">THE USER BECOMES THE CONTEXT CARRIER</text>
    </g>

    <!-- Transition -->
    <circle cx="600" cy="350" r="22" fill="#FFFFFF" stroke="#CBD5E1" />
    <path d="M591 350h17M602 344l6 6-6 6" fill="none" stroke="#64748B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />

    <!-- With Divebell -->
    <g>
      <rect x="640" y="88" width="520" height="530" rx="24" fill="#FFFFFF" stroke="#BFDBFE" />
      <rect x="1155" y="88" width="5" height="530" rx="2.5" fill="#60A5FA" />

      <circle cx="676" cy="130" r="12" fill="#EFF6FF" />
      <path d="M670 130l4 4 8-9" fill="none" stroke="#2563EB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
      <text x="698" y="137" fill="#0F172A" font-size="20" font-weight="700">With Divebell</text>

      <rect x="1014" y="114" width="110" height="28" rx="14" fill="#ECFDF5" stroke="#A7F3D0" />
      <text x="1069" y="132.5" fill="#047857" font-size="10" font-weight="800" letter-spacing="1.1" text-anchor="middle">CONNECTED LOOP</text>

      <line x1="672" y1="156" x2="1128" y2="156" stroke="#DBEAFE" />

      <!-- Page and agent are connected -->
      <rect x="672" y="172" width="166" height="38" rx="12" fill="#F8FAFC" stroke="#CBD5E1" />
      <rect x="686" y="183" width="20" height="16" rx="4" fill="none" stroke="#475569" stroke-width="1.5" />
      <path d="M686 188h20" stroke="#475569" stroke-width="1.5" />
      <text x="716" y="196" fill="#334155" font-size="12" font-weight="700">Real Web page</text>

      <line x1="838" y1="191" x2="958" y2="191" stroke="#93C5FD" stroke-width="2" />
      <circle cx="898" cy="191" r="10" fill="#DBEAFE" />
      <path d="M894 191h8M899 187l4 4-4 4" fill="none" stroke="#2563EB" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />

      <rect x="958" y="172" width="166" height="38" rx="12" fill="#F8FAFC" stroke="#CBD5E1" />
      <rect x="972" y="182" width="21" height="18" rx="5" fill="none" stroke="#475569" stroke-width="1.5" />
      <path d="M977 188l3 3-3 3M983 195h5" fill="none" stroke="#475569" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" />
      <text x="1002" y="196" fill="#334155" font-size="12" font-weight="700">Coding Agent</text>

      <!-- Divebell card -->
      <rect x="672" y="226" width="452" height="204" rx="20" fill="#EFF6FF" stroke="#93C5FD" />
      <text x="698" y="258" fill="#1D4ED8" font-size="11" font-weight="800" letter-spacing="1.4">DIVEBELL</text>
      <text x="698" y="283" fill="#0F172A" font-size="17" font-weight="700">The Web page becomes the agent's workspace</text>

      <g>
        <rect x="698" y="304" width="126" height="64" rx="14" fill="#FFFFFF" stroke="#BFDBFE" />
        <circle cx="716" cy="324" r="7" fill="#DBEAFE" />
        <path d="M712 324h8M716 320v8" stroke="#2563EB" stroke-width="1.4" stroke-linecap="round" />
        <text x="730" y="328" fill="#1E3A8A" font-size="11.5" font-weight="700">Web Context</text>
        <text x="714" y="350" fill="#64748B" font-size="10.5">Page and user path</text>

        <rect x="835" y="304" width="126" height="64" rx="14" fill="#FFFFFF" stroke="#BFDBFE" />
        <circle cx="853" cy="324" r="7" fill="#DBEAFE" />
        <path d="M849 327l3-4 3 2 4-6" fill="none" stroke="#2563EB" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" />
        <text x="867" y="328" fill="#1E3A8A" font-size="11.5" font-weight="700">Diagnostics</text>
        <text x="851" y="350" fill="#64748B" font-size="10.5">Console and Network</text>

        <rect x="972" y="304" width="126" height="64" rx="14" fill="#FFFFFF" stroke="#BFDBFE" />
        <circle cx="990" cy="324" r="7" fill="#DBEAFE" />
        <path d="M986 324l3 3 5-6" fill="none" stroke="#2563EB" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" />
        <text x="1004" y="328" fill="#1E3A8A" font-size="11.5" font-weight="700">Verification</text>
        <text x="988" y="350" fill="#64748B" font-size="10.5">Same real scenario</text>
      </g>

      <rect x="698" y="385" width="62" height="22" rx="11" fill="#DBEAFE" />
      <text x="729" y="400" fill="#1D4ED8" font-size="9.5" font-weight="800" text-anchor="middle">OPTIONAL</text>
      <text x="772" y="400" fill="#475569" font-size="10.5">
        Runtime Core · Expose application runtime facts
      </text>

      <!-- Extension and existing tools -->
      <path d="M898 430v12" stroke="#86EFAC" stroke-width="2" stroke-linecap="round" />
      <rect x="672" y="442" width="452" height="84" rx="18" fill="#F0FDF4" stroke="#86EFAC" />
      <text x="698" y="468" fill="#047857" font-size="12.5" font-weight="800">Extension</text>
      <text x="769" y="468" fill="#475569" font-size="11">connects existing capabilities</text>

      <g fill="#FFFFFF" stroke="#BBF7D0">
        <rect x="698" y="482" width="62" height="27" rx="13.5" />
        <rect x="768" y="482" width="78" height="27" rx="13.5" />
        <rect x="854" y="482" width="58" height="27" rx="13.5" />
        <rect x="920" y="482" width="112" height="27" rx="13.5" />
      </g>
      <g fill="#166534" font-size="10.5" font-weight="700" text-anchor="middle">
        <text x="729" y="500">SDK</text>
        <text x="807" y="500">OpenAPI</text>
        <text x="883" y="500">CLI</text>
        <text x="976" y="500">Internal Tools</text>
      </g>

      <!-- Agent outcome -->
      <path d="M898 526v12" stroke="#93C5FD" stroke-width="2" stroke-linecap="round" />
      <rect x="672" y="538" width="452" height="54" rx="16" fill="#0F172A" />
      <text x="698" y="570" fill="#FFFFFF" font-size="12.5" font-weight="700">Coding Agent</text>
      <circle cx="810" cy="565" r="3" fill="#60A5FA" />
      <text x="826" y="570" fill="#BFDBFE" font-size="12" font-weight="700">Diagnose</text>
      <circle cx="906" cy="565" r="3" fill="#34D399" />
      <text x="922" y="570" fill="#D1FAE5" font-size="12" font-weight="700">Fix</text>
      <circle cx="969" cy="565" r="3" fill="#34D399" />
      <text x="985" y="570" fill="#D1FAE5" font-size="12" font-weight="700">Verify</text>

      <rect x="789" y="590" width="218" height="26" rx="13" fill="#ECFDF5" />
      <text x="898" y="607" fill="#047857" font-size="10.5" font-weight="700" text-anchor="middle">PAGE, TOOLS, AND AGENT STAY CONNECTED</text>
    </g>
  </g>
</svg>
